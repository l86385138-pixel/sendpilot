<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SendPilot — Contacts</title><link rel="stylesheet" href="style.css"><style>
.page{min-height:100vh;display:flex}.side{width:230px;border-right:1px solid #ffffff10;padding:22px 14px;background:#0b0e15}.side .brand{margin:0 8px 35px}.navx{display:grid;gap:5px}.navx button{border:0;background:transparent;color:#858c9d;text-align:left;padding:12px;border-radius:9px;cursor:pointer}.navx button.active,.navx button:hover{background:#7777ff18;color:#c5c6ff}.main{flex:1;padding:35px;max-width:1200px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.head h1{font:600 32px 'Space Grotesk';margin:0 0 5px}.muted{color:#858c9d}.panel{border:1px solid #ffffff10;background:#ffffff04;border-radius:15px;padding:20px;margin-bottom:15px}.formgrid{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px}.input{width:100%;padding:12px;border-radius:9px;border:1px solid #ffffff14;background:#080b11;color:#fff}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:13px 10px;border-bottom:1px solid #ffffff0b;font-size:13px}.table th{color:#70788a;font-size:10px;letter-spacing:1px}.danger{color:#ff9d9d;background:transparent;border:0;cursor:pointer}.status{margin-top:10px;font-size:12px;color:#62d9c2}@media(max-width:850px){.side{width:70px}.side .brand span,.navx button span{display:none}.main{padding:20px}.formgrid{grid-template-columns:1fr 1fr}.formgrid .btn{grid-column:span 2}}
</style></head><body><div class="page"><aside class="side"><a class="brand" href="index.html"><span class="brand-mark">S</span><span>SendPilot</span></a><nav class="navx"><button onclick="location.href='dashboard.html'">◈ <span>Overview</span></button><button class="active">◎ <span>Contacts</span></button><button onclick="location.href='campaigns.html'">▣ <span>Campaigns</span></button><button onclick="location.href='reports.html'">◌ <span>Reports</span></button></nav></aside><main class="main"><div class="head"><div><h1>Contacts</h1><div class="muted">Manage opted-in recipients for your campaigns.</div></div><button class="btn ghost" id="logout">Log out</button></div><div class="panel"><h3>Add contact</h3><div class="formgrid"><input class="input" id="name" placeholder="Name"><input class="input" id="phone" placeholder="Phone e.g. 919876543210"><input class="input" id="group" placeholder="Group" value="General"><button class="btn primary" id="add">Add contact</button></div><div id="status" class="status"></div></div><div class="panel"><table class="table"><thead><tr><th>NAME</th><th>PHONE</th><th>GROUP</th><th>ACTION</th></tr></thead><tbody id="rows"></tbody></table></div></main></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";import{getFirestore,collection,addDoc,query,where,getDocs,deleteDoc,doc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";
const config={apiKey:"AIzaSyDU9UzWb0tNicMOLZ6K01TGJ4-xrLEu-aQ",authDomain:"sendpilot-bf3b0.firebaseapp.com",projectId:"sendpilot-bf3b0",storageBucket:"sendpilot-bf3b0.firebasestorage.app",messagingSenderId:"711768959361",appId:"1:711768959361:web:35c6a722ae3fd40031a080"};const auth=getAuth(initializeApp(config)),db=getFirestore();let uid="";
const nameInput=document.getElementById("name"), phoneInput=document.getElementById("phone"), groupInput=document.getElementById("group"), addBtn=document.getElementById("add"), statusEl=document.getElementById("status"), rowsEl=document.getElementById("rows"), logoutBtn=document.getElementById("logout");
onAuthStateChanged(auth,u=>{if(!u)location.href="index.html";else{uid=u.uid;load()}});
async function load(){const q=query(collection(db,"contacts"),where("userId","==",uid));const s=await getDocs(q);rowsEl.innerHTML="";s.forEach(x=>{const v=x.data();rowsEl.insertAdjacentHTML("beforeend",`<tr><td>${v.name||""}</td><td>${v.phone||""}</td><td>${v.group||"General"}</td><td><button class="danger" data-id="${x.id}">Delete</button></td></tr>`)});document.querySelectorAll(".danger").forEach(b=>b.onclick=async()=>{await deleteDoc(doc(db,"contacts",b.dataset.id));load()})}
addBtn.onclick=async()=>{statusEl.textContent="";if(!nameInput.value.trim()||!phoneInput.value.trim()){statusEl.textContent="Name and phone required";return}try{await addDoc(collection(db,"contacts"),{name:name:nameInput.value.trim(),phone:phoneInput.value.trim().replace(/\D/g,""),userId:uid,group:groupInput.value.trim()||"General",status:"active",createdAt:serverTimestamp()});nameInput.value="";phoneInput.value="";statusEl.textContent="Contact added successfully";load()}catch(e){statusEl.textContent=e.message}}
logoutBtn.onclick=()=>signOut(auth).then(()=>location.href="index.html");
</script></body></html>
