<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SendPilot — Contacts</title><link rel="stylesheet" href="style.css"><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><style>
.page{min-height:100vh;display:flex}.side{width:230px;border-right:1px solid #ffffff10;padding:22px 14px;background:#0b0e15}.side .brand{margin:0 8px 35px}.navx{display:grid;gap:5px}.navx button{border:0;background:transparent;color:#858c9d;text-align:left;padding:12px;border-radius:9px;cursor:pointer}.navx button.active,.navx button:hover{background:#7777ff18;color:#c5c6ff}.main{flex:1;padding:35px;max-width:1250px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.head h1{font:600 32px 'Space Grotesk';margin:0 0 5px}.muted{color:#858c9d}.panel{border:1px solid #ffffff10;background:#ffffff04;border-radius:15px;padding:20px;margin-bottom:15px}.formgrid{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px}.input{width:100%;padding:12px;border-radius:9px;border:1px solid #ffffff14;background:#080b11;color:#fff}.upload{border:1px dashed #7777ff55;border-radius:11px;padding:16px;background:#7777ff08;margin-top:14px}.upload input{margin-top:10px;color:#9ea5b5}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.filter{border:1px solid #ffffff12;background:#ffffff07;color:#aab0bf;border-radius:8px;padding:8px 11px;cursor:pointer}.filter.active{background:#7777ff22;color:#d4d5ff}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 9px;border-bottom:1px solid #ffffff0b;font-size:13px}.table th{color:#70788a;font-size:10px;letter-spacing:1px}.statusmsg{margin-top:10px;font-size:12px;color:#62d9c2}.interest{border:1px solid #ffffff15;background:#ffffff07;color:#b8bdcb;border-radius:7px;padding:6px 8px;cursor:pointer}.interest.on{background:#1a6b5d;color:#b8fff0}.optin{border:1px solid #ffffff15;background:#ffffff07;color:#b8bdcb;border-radius:7px;padding:6px 8px;cursor:pointer}.optin.on{background:#1a6b5d;color:#b8fff0}.danger{color:#ff9d9d;background:transparent;border:0;cursor:pointer}@media(max-width:850px){.side{width:70px}.side .brand span,.navx button span{display:none}.main{padding:20px}.formgrid{grid-template-columns:1fr}.table{font-size:11px}}
</style></head><body><div class="page"><aside class="side"><a class="brand" href="index.html"><span class="brand-mark">S</span><span>SendPilot</span></a><nav class="navx"><button onclick="location.href='dashboard.html'">◈ <span>Overview</span></button><button class="active">◎ <span>Contacts</span></button><button onclick="location.href='campaigns.html'">▣ <span>Campaigns</span></button><button onclick="location.href='reports.html'">◌ <span>Reports</span></button></nav></aside><main class="main"><div class="head"><div><h1>Contacts</h1><div class="muted">Add contacts manually or import a large list from Excel, CSV or text-based PDF.</div></div><button class="btn ghost" id="logout">Log out</button></div>
<div class="panel"><h3>Add contact</h3><div class="formgrid"><input class="input" id="name" placeholder="Name"><input class="input" id="phone" placeholder="Phone e.g. 919876543210"><input class="input" id="group" placeholder="Group" value="General"><button class="btn primary" id="add">Add contact</button></div><div class="upload"><b>Bulk import</b><div class="muted">Excel/CSV: columns like Name, Phone, Group. PDF: text must contain phone numbers.</div><input id="file" type="file" accept=".xlsx,.xls,.csv,.pdf"></div><div id="status" class="statusmsg"></div></div>
<div class="panel"><div class="toolbar"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="interested">Interested customers</button><span class="muted" id="count"></span></div><div style="overflow:auto;margin-top:12px"><table class="table"><thead><tr><th>NAME</th><th>PHONE</th><th>GROUP</th><th>STATUS</th><th>WHATSAPP OPT-IN</th><th>ACTION</th></tr></thead><tbody id="rows"></tbody></table></div></div></main></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";import{getFirestore,collection,addDoc,query,where,getDocs,deleteDoc,doc,updateDoc,writeBatch,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";
import*as pdfjsLib from"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";
const config={apiKey:"AIzaSyDU9UzWb0tNicMOLZ6K01TGJ4-xrLEu-aQ",authDomain:"sendpilot-bf3b0.firebaseapp.com",projectId:"sendpilot-bf3b0",storageBucket:"sendpilot-bf3b0.firebasestorage.app",messagingSenderId:"711768959361",appId:"1:711768959361:web:35c6a722ae3fd40031a080"};
const auth=getAuth(initializeApp(config)),db=getFirestore();let uid="",allContacts=[],filter="all";
const nameInput=document.getElementById("name"),phoneInput=document.getElementById("phone"),groupInput=document.getElementById("group"),addBtn=document.getElementById("add"),statusEl=document.getElementById("status"),rowsEl=document.getElementById("rows"),logoutBtn=document.getElementById("logout"),fileInput=document.getElementById("file"),countEl=document.getElementById("count");
onAuthStateChanged(auth,u=>{if(!u)location.href="index.html";else{uid=u.uid;load()}});
async function load(){const s=await getDocs(query(collection(db,"contacts"),where("userId","==",uid)));allContacts=[];s.forEach(x=>allContacts.push({id:x.id,...x.data()}));render()}
function render(){const list=filter==="interested"?allContacts.filter(x=>x.interest==="interested"):allContacts;rowsEl.innerHTML="";countEl.textContent=list.length+" contacts";list.forEach(v=>rowsEl.insertAdjacentHTML("beforeend",`<tr><td>${esc(v.name||"")}</td><td>${esc(v.phone||"")}</td><td>${esc(v.group||"General")}</td><td><button class="interest ${v.interest==="interested"?"on":""}" data-interest="${v.id}">${v.interest==="interested"?"✓ Interested":"Mark interested"}</button></td><td><button class="optin ${v.optIn===true?"on":""}" data-optin="${v.id}">${v.optIn===true?"✓ Opted in":"Not opted in"}</button></td><td><button class="danger" data-delete="${v.id}">Delete</button></td></tr>`));document.querySelectorAll("[data-interest]").forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,"contacts",b.dataset.interest),{interest:b.classList.contains("on")?"new":"interested"});load()});document.querySelectorAll("[data-optin]").forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,"contacts",b.dataset.optin),{optIn:!b.classList.contains("on")});load()});document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=async()=>{await deleteDoc(doc(db,"contacts",b.dataset.delete));load()})}
function esc(v){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
addBtn.onclick=async()=>{statusEl.textContent="";if(!nameInput.value.trim()||!phoneInput.value.trim()){statusEl.textContent="Name and phone required";return}try{await addDoc(collection(db,"contacts"),{name:nameInput.value.trim(),phone:phoneInput.value.trim().replace(/\D/g,""),userId:uid,group:groupInput.value.trim()||"General",interest:"new",optIn:false,status:"active",createdAt:serverTimestamp()});nameInput.value="";phoneInput.value="";statusEl.textContent="Contact added successfully";load()}catch(e){statusEl.textContent=e.message}};
document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()});
fileInput.onchange=async()=>{const file=fileInput.files[0];if(!file)return;statusEl.textContent="Reading "+file.name+"...";try{let records=[];if(file.name.toLowerCase().endsWith(".pdf"))records=await parsePDF(file);else records=parseSheet(await file.arrayBuffer(),file.name);await importRecords(records);fileInput.value=""}catch(e){statusEl.textContent="Import failed: "+e.message}};
function normalizePhone(v){return String(v??"").replace(/\D/g,"")}
function parseSheet(buf,name){const wb=XLSX.read(buf,{type:"array"});const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});return rows.map(r=>{const vals=r.map(x=>String(x).trim());let phone=vals.find(x=>normalizePhone(x).length>=10);let nm=vals.find(x=>x!==phone&&/[A-Za-z]/.test(x))||"Imported Contact";return phone?{name:nm,phone:normalizePhone(phone),group:"Imported"}:null}).filter(Boolean)}
async function parsePDF(file){const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;let text="";for(let i=1;i<=pdf.numPages;i++){const p=await pdf.getPage(i),c=await p.getTextContent();text+=c.items.map(x=>x.str).join(" ")+"\n"}const nums=text.match(/(?:\+?\d[\d\s().-]{8,}\d)/g)||[];return [...new Set(nums.map(normalizePhone).filter(x=>x.length>=10&&x.length<=15))].map((phone,i)=>({name:"PDF Contact "+(i+1),phone,group:"PDF Import"}))}
async function importRecords(records){if(!records.length){statusEl.textContent="No phone numbers found. Scanned/image-only PDF may need OCR.";return}const existing=new Set(allContacts.map(x=>normalizePhone(x.phone)));const unique=records.filter(x=>{x.phone=normalizePhone(x.phone);if(x.phone.length<10||existing.has(x.phone))return false;existing.add(x.phone);return true});for(let i=0;i<unique.length;i+=450){const batch=writeBatch(db);unique.slice(i,i+450).forEach(x=>batch.set(doc(collection(db,"contacts")),{name:x.name||"Imported Contact",phone:x.phone,userId:uid,group:x.group||"Imported",interest:"new",optIn:false,status:"active",createdAt:serverTimestamp()}));await batch.commit()}statusEl.textContent=unique.length+" contacts imported successfully.";await load()}
logoutBtn.onclick=()=>signOut(auth).then(()=>location.href="index.html");
</script></body></html>
