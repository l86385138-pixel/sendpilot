<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SendPilot — Campaigns</title><link rel="stylesheet" href="style.css"><style>
.page{min-height:100vh;display:flex}.side{width:230px;border-right:1px solid #ffffff10;padding:22px 14px;background:#0b0e15}.side .brand{margin:0 8px 35px}.navx{display:grid;gap:5px}.navx button{border:0;background:transparent;color:#858c9d;text-align:left;padding:12px;border-radius:9px;cursor:pointer}.navx button.active,.navx button:hover{background:#7777ff18;color:#c5c6ff}.main{flex:1;padding:35px;max-width:1200px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.head h1{font:600 32px 'Space Grotesk';margin:0 0 5px}.muted{color:#858c9d}.panel{border:1px solid #ffffff10;background:#ffffff04;border-radius:15px;padding:20px;margin-bottom:15px}.input,.area{width:100%;padding:12px;border-radius:9px;border:1px solid #ffffff14;background:#080b11;color:#fff}.area{min-height:110px;resize:vertical;margin-top:10px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:13px 10px;border-bottom:1px solid #ffffff0b;font-size:13px}.table th{color:#70788a;font-size:10px;letter-spacing:1px}.status{margin-top:10px;color:#62d9c2;font-size:12px}@media(max-width:850px){.side{width:70px}.side .brand span,.navx button span{display:none}.main{padding:20px}.formgrid{grid-template-columns:1fr}}
</style></head><body><div class="page"><aside class="side"><a class="brand" href="index.html"><span class="brand-mark">S</span><span>SendPilot</span></a><nav class="navx"><button onclick="location.href='dashboard.html'">◈ <span>Overview</span></button><button onclick="location.href='contacts.html'">◎ <span>Contacts</span></button><button class="active">▣ <span>Campaigns</span></button><button onclick="location.href='reports.html'">◌ <span>Reports</span></button></nav></aside><main class="main"><div class="head"><div><h1>Campaigns</h1><div class="muted">Create personalized campaign drafts.</div></div><button class="btn ghost" id="logout">Log out</button></div><div class="panel"><h3>New campaign</h3><div class="formgrid"><input class="input" id="cname" placeholder="Campaign name"><input class="input" id="message" placeholder="Message, use {name} for personalization"><textarea class="area full" id="preview" placeholder="Write your message here..."></textarea><button class="btn primary" id="save">Save draft</button></div><div id="status" class="status"></div></div><div class="panel"><table class="table"><thead><tr><th>CAMPAIGN</th><th>MESSAGE</th><th>STATUS</th></tr></thead><tbody id="rows"></tbody></table></div></main></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";import{getFirestore,collection,addDoc,query,where,getDocs,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";
const config={apiKey:"AIzaSyDU9UzWb0tNicMOLZ6K01TGJ4-xrLEu-aQ",authDomain:"sendpilot-bf3b0.firebaseapp.com",projectId:"sendpilot-bf3b0",storageBucket:"sendpilot-bf3b0.firebasestorage.app",messagingSenderId:"711768959361",appId:"1:711768959361:web:35c6a722ae3fd40031a080"};const auth=getAuth(initializeApp(config)),db=getFirestore();let uid="";
const campaignNameInput=document.getElementById("cname"), messageInput=document.getElementById("message"), previewInput=document.getElementById("preview"), saveBtn=document.getElementById("save"), statusEl=document.getElementById("status"), rowsEl=document.getElementById("rows"), logoutBtn=document.getElementById("logout");
onAuthStateChanged(auth,u=>{if(!u)location.href="index.html";else{uid=u.uid;load()}});
async function load(){const s=await getDocs(query(collection(db,"campaigns"),where("userId","==",uid)));rowsEl.innerHTML="";s.forEach(x=>{const v=x.data();rowsEl.insertAdjacentHTML("beforeend",`<tr><td>${v.name||""}</td><td>${v.message||""}</td><td>${v.status||"draft"}</td></tr>`)});}
saveBtn.onclick=async()=>{statusEl.textContent="";if(!campaignNameInput.value.trim()||!messageInput.value.trim()){statusEl.textContent="Campaign name and message required";return}try{await addDoc(collection(db,"campaigns"),{userId:uid,name:cname.value.trim(),message:message.value.trim(),status:"draft",totalContacts:"0",sentCount:"0",deliveredCount:"0",failedCount:"0",createdAt:serverTimestamp()});campaignNameInput.value="";messageInput.value="";previewInput.value="";statusEl.textContent="Campaign saved";load()}catch(e){statusEl.textContent=e.message}}
previewInput.oninput=()=>messageInput.value=previewInput.value;logoutBtn.onclick=()=>signOut(auth).then(()=>location.href="index.html");
</script></body></html>
