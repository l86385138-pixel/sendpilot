<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SendPilot — Reports</title><link rel="stylesheet" href="style.css"><style>
.page{min-height:100vh;display:flex}.side{width:230px;border-right:1px solid #ffffff10;padding:22px 14px;background:#0b0e15}.side .brand{margin:0 8px 35px}.navx{display:grid;gap:5px}.navx button{border:0;background:transparent;color:#858c9d;text-align:left;padding:12px;border-radius:9px;cursor:pointer}.navx button.active,.navx button:hover{background:#7777ff18;color:#c5c6ff}.main{flex:1;padding:35px;max-width:1200px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.head h1{font:600 32px 'Space Grotesk';margin:0 0 5px}.muted{color:#858c9d}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{border:1px solid #ffffff10;background:#ffffff05;border-radius:14px;padding:20px}.card small{color:#70788a;letter-spacing:1px;font-size:10px}.card strong{display:block;font:600 27px 'Space Grotesk';margin-top:10px}.panel{margin-top:15px;border:1px solid #ffffff10;background:#ffffff04;border-radius:15px;padding:22px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:13px 10px;border-bottom:1px solid #ffffff0b;font-size:13px}.table th{color:#70788a;font-size:10px;letter-spacing:1px}@media(max-width:850px){.side{width:70px}.side .brand span,.navx button span{display:none}.main{padding:20px}.cards{grid-template-columns:1fr 1fr}}
</style></head><body><div class="page"><aside class="side"><a class="brand" href="index.html"><span class="brand-mark">S</span><span>SendPilot</span></a><nav class="navx"><button onclick="location.href='dashboard.html'">◈ <span>Overview</span></button><button onclick="location.href='contacts.html'">◎ <span>Contacts</span></button><button onclick="location.href='campaigns.html'">▣ <span>Campaigns</span></button><button class="active">◌ <span>Reports</span></button></nav></aside><main class="main"><div class="head"><div><h1>Reports</h1><div class="muted">Your workspace activity summary.</div></div><button class="btn ghost" id="logout">Log out</button></div><div class="cards"><div class="card"><small>CONTACTS</small><strong id="contacts">0</strong></div><div class="card"><small>CAMPAIGNS</small><strong id="campaigns">0</strong></div><div class="card"><small>MESSAGES</small><strong id="messages">0</strong></div><div class="card"><small>STATUS</small><strong>Ready</strong></div></div><div class="panel"><table class="table"><thead><tr><th>METRIC</th><th>VALUE</th></tr></thead><tbody><tr><td>Contacts in workspace</td><td id="rcontacts">0</td></tr><tr><td>Campaign drafts</td><td id="rcampaigns">0</td></tr><tr><td>Message records</td><td id="rmessages">0</td></tr></tbody></table></div></main></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";import{getFirestore,collection,query,where,getDocs}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";
const config={apiKey:"AIzaSyDU9UzWb0tNicMOLZ6K01TGJ4-xrLEu-aQ",authDomain:"sendpilot-bf3b0.firebaseapp.com",projectId:"sendpilot-bf3b0",storageBucket:"sendpilot-bf3b0.firebasestorage.app",messagingSenderId:"711768959361",appId:"1:711768959361.web:35c6a722ae3fd40031a080"};config.appId="1:711768959361:web:35c6a722ae3fd40031a080";const auth=getAuth(initializeApp(config)),db=getFirestore();let uid="";
onAuthStateChanged(auth,async u=>{if(!u)location.href="index.html";else{uid=u.uid;await load()}});
async function count(col){return (await getDocs(query(collection(db,col),where("userId","==",uid)))).size}
async function load(){const c=await count("contacts"),ca=await count("campaigns");document.querySelector("#contacts").textContent=c;document.querySelector("#rcontacts").textContent=c;document.querySelector("#campaigns").textContent=ca;document.querySelector("#rcampaigns").textContent=ca;document.querySelector("#messages").textContent="—";document.querySelector("#rmessages").textContent="—"}
logout.onclick=()=>signOut(auth).then(()=>location.href="index.html");
</script></body></html>
